<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shield.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surakshit Bharat — Unified National Safety Intelligence Platform</title>
    <meta name="description" content="Surakshit Bharat: Measure. Route. Resolve. Unified national intelligence across community safety, local manufacturing standards, transport corridors, and digital vigilance." />
    
    <!-- Google Fonts: Fraunces (Display Serif), Manrope (UI Sans), JetBrains Mono (Data/Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-paper text-ink dark:bg-ink dark:text-paper selection:bg-saffron selection:text-white transition-colors duration-200 antialiased font-sans">
    <div id="root"></div>

    <!-- Hidden Google Neural Translation Element -->
    <div id="google_translate_element" style="display: none;"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,ta',
            autoDisplay: false
          }, 'google_translate_element');
        }
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
